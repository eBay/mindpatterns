name: Dependabot security auto-merge

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  automerge:
    # Only proceed if CI passed and the workflow was triggered by a pull request
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    concurrency:
      group: dependabot-automerge-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
      vulnerability-alerts: read

    defaults:
      run:
        shell: bash

    steps:
      - name: Get PR number for this workflow run
        id: get-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # Prefer PR number from the workflow_run payload when available
          PR_NUMBER="${{ github.event.workflow_run.pull_requests[0].number }}"

          # Fallback: search all open PRs (with pagination) for matching HEAD_SHA
          if [ -z "$PR_NUMBER" ]; then
            PR_NUMBER=$(gh api repos/${{ github.repository }}/pulls --paginate \
              --jq ".[] | select(.head.sha == \"$HEAD_SHA\") | .number" | head -1)
          fi

          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT

      - name: Get PR author and changed files
        id: pr-info
        if: steps.get-pr.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.get-pr.outputs.pr_number }}
        run: |
          AUTHOR=$(gh api repos/${{ github.repository }}/pulls/$PR_NUMBER \
            --jq '.user.login')
          FILES=$(gh api repos/${{ github.repository }}/pulls/$PR_NUMBER/files \
            --jq '[.[].filename] | join(" ")')
          TITLE=$(gh api repos/${{ github.repository }}/pulls/$PR_NUMBER \
            --jq '.title')
          echo "author=$AUTHOR" >> $GITHUB_OUTPUT
          echo "files=$FILES" >> $GITHUB_OUTPUT
          echo "title=$TITLE" >> $GITHUB_OUTPUT

      - name: Check bumped packages against open Dependabot alerts
        id: security-check
        if: |
          steps.pr-info.outputs.author == 'dependabot[bot]' &&
          (steps.pr-info.outputs.files == 'package-lock.json' || steps.pr-info.outputs.files == 'Gemfile.lock')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: ${{ steps.pr-info.outputs.title }}
          LOCKFILE: ${{ steps.pr-info.outputs.files }}
        run: |
          # Fetch separately so API errors cannot be hidden by a pipeline.
          ALERTS=$(gh api "repos/${{ github.repository }}/dependabot/alerts?state=open&per_page=100" --paginate --slurp)
          OPEN_ALERT_PACKAGES=$(jq -r --arg manifest "$LOCKFILE" \
            '.[][] | select(.state == "open" and .dependency.manifest_path == $manifest) | .dependency.package.name' <<< "$ALERTS" | sort -u)

          # Accept single-package and grouped/ancestor bump titles.
          PACKAGES=$(printf '%s\n' "$TITLE" | sed -nE 's/^.*[Bb]ump (.*)$/\1/p' | sed -E 's/ from .* to .*$//; s/, and /\n/g; s/, /\n/g; s/ and /\n/g')
          IS_SECURITY=false
          MATCHED_PKG=""
          while IFS= read -r PKG; do
            [ -z "$PKG" ] && continue
            if grep -Fxq -- "$PKG" <<< "$OPEN_ALERT_PACKAGES"; then
              IS_SECURITY=true
              MATCHED_PKG="$PKG"
              break
            fi
          done <<< "$PACKAGES"
          echo "package=$MATCHED_PKG" >> "$GITHUB_OUTPUT"
          echo "is_security=$IS_SECURITY" >> "$GITHUB_OUTPUT"
          echo "Security alert match: $IS_SECURITY; package: ${MATCHED_PKG:-none}; lockfile: $LOCKFILE"

      - name: Auto-approve and merge security-only lock file updates
        if: |
          steps.pr-info.outputs.author == 'dependabot[bot]' &&
          (steps.pr-info.outputs.files == 'package-lock.json' || steps.pr-info.outputs.files == 'Gemfile.lock') &&
          steps.security-check.outputs.is_security == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.get-pr.outputs.pr_number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          CURRENT_SHA=$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER" --jq .head.sha)
          if [ "$CURRENT_SHA" != "$HEAD_SHA" ]; then
            echo "PR head changed since CI completed; waiting for CI on the new commit."
            exit 0
          fi
          gh pr review $PR_NUMBER --approve --repo ${{ github.repository }} \
            --body "Auto-approving: security patch, lock file only."

          for attempt in 1 2 3 4 5; do
            if gh pr merge "$PR_NUMBER" --squash --match-head-commit "$HEAD_SHA" --repo ${{ github.repository }}; then
              exit 0
            fi
            echo "Merge attempt $attempt failed, retrying in 10s..."
            sleep 10
          done
          echo "::error::Failed to merge PR $PR_NUMBER after 5 attempts"
          exit 1
